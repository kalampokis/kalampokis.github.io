const caseCard = () => `<div class="card case"><div class="lab">The case</div><div style="font-size:16px;line-height:1.5">A hotel group in Portugal (a resort in the Algarve and a city hotel in Lisbon) wants to know which bookings will be cancelled. The data and every number on this page are real: ${N(D.meta.n)} bookings with arrival from July 2015 to August 2017, ${D.meta.n_feat} columns, <b>${P1(D.meta.rate)}</b> cancelled. An XGBoost model with ${M.trees} trees and ${N(M.leaves)} leaves was trained on ${N(D.meta.n_train)} bookings. Everything below is measured on the other ${N(D.meta.n_test)}.</div></div>`;

    <div class="grid2"><div class="card"><div class="lab">Test AUC</div>${vbar([['with the deposit columns', M.auc, F3(M.auc)], ['without them', DR.no_dep.auc, F3(DR.no_dep.auc), '#D9690F']], 0.5, 1)}</div>
    <div class="card"><div class="lab">A second model guesses the deposit column</div>
      <div style="font-size:16px;line-height:1.5">Its only job: say whether a booking has a non-refundable deposit, from the other ${D.meta.n_feat - 3} columns.</div>
      <div class="stat">${big((100 * gs.acc).toFixed(2) + '%', 'accuracy on the test bookings')}${big(N(gs.found), `found, of the ${N(gs.n)} that have one`)}</div>
      <div class="small">It leans most on: ${gs.top.slice(0, 4).map(t => nm(t.name).toLowerCase()).join(', ')}.</div></div></div>
    <div class="q">What share of the non-refundable test bookings did the second model find? ${inp('g6')} % ${mark(S.c6b, okG)} <button class="btn" id="c6b">Check</button></div>`;
    if (S.c6b && !S.ok6b) h += `<div class="status bad">Not yet. Found ÷ those that have one, as a percentage with one decimal.</div>`;
    if (S.ok6b) h += `${mcq('q6', `Explain it: the column has ${P1(D.gain[0].share)} of the gain, and the model does not need it. Why?`, [
      'The other columns give it away. A group or tour operator booking with no request, made long ahead, is the same booking. Importance shows what the model used, not what it needs.',
      'Gain is unreliable and should never be reported.',
      'The test set is too small to show the difference.'], 0,
      'Last week the model never saw Sex and guessed it from Relationship. Deleting a column does not delete the information. Before you report “the top driver”, ask what stands behind it.')}
    ${mcqOk('q6', 0) ? nextBtn() : ''}`;
    h += '</div>';
  }
  return h + '</div>';
}
function s6wire() {
  $('#c6').onclick = () => { S.c6 = true; if (S.p6) S.ok6 = true; render(); };
  const b = $('#c6b'); if (b) b.onclick = () => { S.c6b = true; if (near(S.g6, 100 * DR.guess.found / DR.guess.n, 0.06)) S.ok6b = true; render(); };
}

/* ---------- step 7: too good to be true ---------- */
function s7() {
  const cancNo = ND.canceled + NR.canceled + RF.canceled - PK.canceled_with;
  const okA = near(S.k7a, 0, 0.001), okB = near(S.k7b, 100 * PK.rate_without, 0.06);
  let h = `<div class="box"><p class="task">The second column in the gain ranking is the parking space. In the SHAP values, a booking with a parking space gets <b>${sgn(SH.parking[1].shap)} points</b> from it. Look at the column in the data.</p>
  <div class="card"><table class="ord"><tr><th>Parking space requested</th><th class="r">bookings</th><th class="r">cancelled</th><th class="r">share cancelled</th></tr>
    <tr><td>Yes</td><td class="r mono">${N(PK.n_with)}</td><td class="r mono">${N(PK.canceled_with)}</td><td class="r nw">${inp('k7a')} % ${mark(S.c7, okA)}</td></tr>
    <tr><td>No</td><td class="r mono">${N(PK.n_without)}</td><td class="r mono">${N(cancNo)}</td><td class="r nw">${inp('k7b')} % ${mark(S.c7, okB)}</td></tr></table>
    <div><button class="btn" id="c7">Check</button></div></div>`;
  if (S.c7 && !S.ok7) h += `<div class="status bad">Not yet. Cancelled ÷ bookings, as a percentage with one decimal.</div>`;
  if (S.ok7) {
    h += `<div class="box sep">${mcq('q7a', `${N(PK.n_with)} bookings and not one cancellation. Which story is more plausible?`, [
      'Guests who travel by car are perfectly reliable.',
      'The parking space is entered in the system when the guest is at the front desk. Then the column is filled in only for guests who arrived, and it is not known on the day we want to predict.',
      'It is a coincidence. With this many bookings such things happen.'], 1,
      'This is leakage: information from the future inside a feature. The authors of the dataset warn that some fields change at check-in. We cannot prove it from the data, so it is one more question for the hotel.')}`;
    if (mcqOk('q7a', 1)) h += `<div class="card"><div class="lab">Test AUC, three ways to measure it</div>
      ${vbar([['all test bookings', M.auc, F3(M.auc)], ['model trained without the parking column', DR.no_park.auc, F3(DR.no_park.auc), '#D9690F'], ['the same model, only on bookings without a non-refundable deposit', DR.no_park.auc_no_nr, F3(DR.no_park.auc_no_nr), '#D9690F']], 0.5, 1)}
      <div class="small">${N(DR.guess.n)} of the test bookings have a non-refundable deposit and are classified by one rule. The hotel needs the model for the others.</div></div>
    ${mcq('q7', 'Explain it: the hotel asks how good the model will be next season, on the bookings where it needs help. Which number do you report?', [
      `About ${F3(DR.no_park.auc_no_nr)}. The ${F3(M.auc)} includes a column that is probably not known in time, and thousands of bookings that one rule already classifies.`,
      `${F3(M.auc)}. It was measured on test bookings that the model never saw, so it is the honest number.`,
      `${F3(M.auc_train)}, the AUC on the training bookings, because the model knows them best.`], 0,
      'A test set protects against memorising. It does not protect against a leak, because the leak is in the test bookings too. Accuracy cannot find a leak. An explanation can: a column that is too strong, too clean or too convenient is a suspect.')}
    ${mcqOk('q7', 0) ? nextBtn() : ''}`;
    h += '</div>';
  }
  return h + '</div>';
}
function s7wire() {
  $('#c7').onclick = () => { S.c7 = true; if (near(S.k7a, 0, 0.001) && near(S.k7b, 100 * PK.rate_without, 0.06)) S.ok7 = true; render(); };
}

/* ---------- step 8: why this booking ---------- */
function waterfall() {
  const rows = LB.top.map(t => [nm(t.name), t.value, t.shap]).concat([[`${D.meta.n_feat - LB.top.length} other columns`, null, LB.other]]);
  const Wd = 560, L = 236, Rr = 20, rh = 32, lo = 30, hi = 80, x = v => L + (v - lo) * (Wd - L - Rr) / (hi - lo);
  const H = 34 + rh * rows.length + 40;
  let g = '', cum = SH.base;
  [30, 40, 50, 60, 70, 80].forEach(v => g += `<line x1="${x(v)}" x2="${x(v)}" y1="26" y2="${H - 30}" stroke="#E3E7F6"/><text x="${x(v)}" y="${H - 14}" text-anchor="middle" font-size="11" class="mn" style="fill:#5A6385">${v}%</text>`);
  g += `<text x="${x(cum)}" y="16" text-anchor="middle" font-size="12" style="fill:#5A6385">average ${F1(cum)}%</text><line x1="${x(cum)}" x2="${x(cum)}" y1="22" y2="34" stroke="#5A6385" stroke-width="2"/>`;
  rows.forEach((r, i) => {
    const v = r[2], y = 34 + i * rh, a = x(cum), b = x(cum + v), up = v >= 0;
    g += `<text x="6" y="${y + 13}" font-size="13">${r[0]}</text>${r[1] === null ? '' : `<text x="6" y="${y + 26}" font-size="11" style="fill:#5A6385">value: ${r[1]}</text>`}`;
    g += `<rect x="${Math.min(a, b)}" y="${y + 5}" width="${Math.max(1.5, Math.abs(b - a))}" height="16" rx="3" fill="${up ? '#b3261e' : '#1e7a4c'}"/>`;
    g += `<text x="${up ? Math.max(a, b) + 5 : Math.min(a, b) - 5}" y="${y + 18}" text-anchor="${up ? 'start' : 'end'}" font-size="12" font-weight="700" class="mn" style="fill:${up ? '#b3261e' : '#1e7a4c'};paint-order:stroke;stroke:#fff;stroke-width:3.5px;stroke-linejoin:round">${sgn(v)}</text>`;
    g += `<line x1="${b}" x2="${b}" y1="${y + 21}" y2="${y + rh + 5}" stroke="#5A6385" stroke-width="1" stroke-dasharray="2 2"/>`;
    cum += v;
  });
  return `<svg viewBox="0 0 ${Wd} ${H}" style="min-width:500px;width:100%;height:auto" role="img" aria-label="Waterfall of SHAP values from the average prediction to the prediction for this booking">${g}</svg>`;
}
function s8() {
  const up = LB.top.filter(t => t.shap > 0).reduce((a, t) => a + t.shap, 0), okP = near(S.p8, LB.pred, 0.15);
  let h = `<div class="box"><p class="task">The front desk asks why booking ${LB.id} is flagged. A <b>waterfall</b> answers for one booking: start at the average prediction, add what each column contributes, arrive at the prediction for this booking.</p>
  <div class="card"><div class="lab">Booking ${LB.id}: the online booking of step 5</div>
    <div class="small narrow">Swipe sideways to see the whole plot.</div><div class="scroll">${waterfall()}</div>
    <div class="small">Red bars push towards cancel, green bars towards stay. The numbers are percentage points.</div></div>
  <div class="q">Add the ${LB.top.length + 1} bars to the average prediction of ${F1(SH.base)}%. The prediction for this booking is ${inp('p8')} % ${mark(S.c8, okP)}
    and the column that adds the most is ${sel('t8', LB.top.slice(0, 4).map(t => nm(t.name)).sort())} ${mark(S.c8, S.t8 === nm(LB.top[0].name))} <button class="btn" id="c8">Check</button></div>`;
  if (S.c8 && !S.ok8) h += `<div class="status bad">Not yet. Mind the signs: green bars are subtracted.</div>`;
  h += hint('h8', `${F1(SH.base)} ${LB.top.map(t => sgn(t.shap)).join(' ').replace(/\+/g, '+ ').replace(/−/g, '− ')} ${sgn(LB.other).replace('+', '+ ').replace('−', '− ')}`);
  if (S.ok8) h += `<div class="box sep">${mcq('q8', 'Explain it: which answer to the front desk is honest?', [
      `The model flags it mainly because it has no special request, a high price and comes from an online agent. Bookings like this were cancelled more often in the past. These are patterns in our records, not causes.`,
      'Because the guest made no special request. If we add a request to the booking, the guest will come.',
      'Nobody can know. XGBoost is a black box.'], 0,
      'The contributions always add up to the prediction, so the waterfall is a complete account of what the model did. What it means for the hotel is still a judgement.')}`;
  if (mcqOk('q8', 0)) h += `<div class="card case"><div class="lab">Six questions for every explanation</div><div style="font-size:16px;line-height:1.6">
      <b>Direction.</b> Does it make sense? If not, check before you explain it away.<br><b>Data.</b> Do the raw rates say the same as the model?<br><b>Who.</b> Which cases carry the effect?<br>
      <b>Timing.</b> Would I know this column on the day I predict?<br><b>Need.</b> What happens to the model without the column?<br><b>Action.</b> Is the claim about what the model says, or about what the world would do?</div></div>
    <div style="font-size:16px;line-height:1.5">Next: <a href="https://colab.research.google.com/github/kalampokis/kalampokis.github.io/blob/master/dm/Week8/Data_Mining_2026_Week8_notebook.ipynb" target="_blank" rel="noopener">the notebook of this week</a> repeats every step in Python, with xgboost and the shap library.</div>${nextBtn()}`;
  if (S.ok8) h += '</div>';
  return h + '</div>';
}
function s8wire() {
  $('#c8').onclick = () => { S.c8 = true; if (near(S.p8, LB.pred, 0.15) && S.t8 === nm(LB.top[0].name)) S.ok8 = true; render(); };
}

const STEPS = [
  { label: 'The model', title: '1. How good is the model?', html: s1, wire: s1wire, ok: () => mcqOk('q1', 0) },
  { label: 'Importance', title: '2. What does the model use?', html: s2, wire: s2wire, ok: () => mcqOk('q2', 0) },
  { label: 'Check the data', title: '3. Is the model wrong?', html: s3, wire: s3wire, ok: () => mcqOk('q3', 0) },
  { label: 'Who are they', title: '4. Who are these bookings?', html: s4, wire: () => {}, ok: () => mcqOk('q4', 0) },
  { label: 'What-if', title: '5. The what-if trap', html: s5, wire: s5wire, ok: () => mcqOk('q5', 0) },
  { label: 'Delete a column', title: '6. Does the model need its top column?', html: s6, wire: s6wire, ok: () => mcqOk('q6', 0) },
  { label: 'Leakage', title: '7. A column too good to be true', html: s7, wire: s7wire, ok: () => mcqOk('q7', 0) },
  { label: 'One booking', title: '8. Why this booking?', html: s8, wire: s8wire, ok: () => mcqOk('q8', 0) },
];

function drawStepper() {
  $('#stepper').innerHTML = STEPS.map((s, i) => {
    const bg = i === S.step ? '#1B2F6B' : STEPS[i].ok() ? '#26314F' : '#5A6385';
    return `<button data-go="${i}" style="background:${bg}"><span class="n">${i + 1} ${STEPS[i].ok() ? '✓' : ''}</span><span class="l">${s.label}</span></button>`;
  }).join('');
  $$('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
}
function render() {
  const st = STEPS[S.step];
  $('#title').textContent = st.title;
  $('#stage').innerHTML = st.html();
  wireInputs();
  st.wire();
  drawStepper();
  $('#pos').textContent = `${S.step + 1} / ${STEPS.length}`;
  $('#prev').style.opacity = S.step > 0 ? 1 : .4;
  $('#next').style.opacity = S.step < STEPS.length - 1 ? 1 : .4;
}
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  S.step = i; S.max = Math.max(S.max, i);
  try { history.replaceState(null, '', '#step' + (i + 1)); } catch (e) {}
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step + 1);
const m = location.hash.match(/step(\d)/);
S.step = m ? Math.min(Math.max(+m[1] - 1, 0), STEPS.length - 1) : 0;
render();
</script>
