    <div class="hint" style="border-style:solid"><b>score of a review</b> = Σ over the query words of tf × log(N / df) &nbsp;·&nbsp; tf = times the word appears in that review, N = ${I.N.toLocaleString('en')}, df = reviews that contain the word.<br><span class="small">Example · query dies charged, target 2: 1 × ${f2(idfOf('dies'))} (dies) + 1 × ${f2(idfOf('charged'))} (charged) = ${f2(idfOf('dies') + idfOf('charged'))}. A review without the word gets 0 from it.</span></div>
  </div>
  <div class="toggle">${dots}</div>
  <div class="status" id="st3"></div>
  <div class="row" id="tg3"><span class="icon" id="ic3">·</span><div class="rbody">
    <div class="req">Target ${k + 1} of ${TGT.length} · must rank first</div>
    <div class="rv" id="tx3" style="font-size:18px"></div>
    <div class="small"><i>${T.tip}</i></div>
    <div class="fl"><input class="rx" id="q3" value="${esc(S.q3[k])}" placeholder="your query, at most three words" spellcheck="false" autocomplete="off" style="flex:1"><span class="mono" id="rk3" style="min-width:170px;font-size:15px;font-weight:700"></span></div>
  </div></div>
  <div id="res3" class="box"></div>
  <div id="won3"></div>
  ${hintBtn(3, 'Read the idf column first: a word in half of all reviews adds almost nothing. A word that is rare and in the target adds the most. If several reviews share your rare word, add a second word that only the target has, or one that the target repeats.')}
  <div id="after3"></div></div>`;
}
function s3wire() { const i = $('#q3'); i.addEventListener('input', () => { S.q3[S.t3] = i.value; s3check(); }); s3check(); }
function s3check() {
  const I = sIndex(), k = S.t3, t = TGT[k].i, q = S.q3[k], R = search(q);
  let ok = null, msg = '';
  if (R.w.length > 3) { ok = false; msg = `${R.w.length} words: at most 3`; }
  else if (R.w.length) { const { r, ties, m } = rankOf(R.sc, t); ok = r === 1 && ties === 0 && m > 0; msg = m === 0 ? 'score 0' : r === 1 && ties ? `rank 1, tied with ${ties}` : `rank ${r} of ${I.N.toLocaleString('en')}`; }
  $('#tg3').className = 'row ' + (ok === null ? '' : ok ? 'pass' : 'fail');
  $('#ic3').textContent = ok === null ? '·' : ok ? '✓' : '✗'; $('#ic3').className = 'icon ' + (ok ? 'ok' : 'bad');
  $('#rk3').textContent = msg; $('#rk3').className = 'mono ' + (ok ? 'ok' : ok === false ? 'bad' : '');
  $('#tx3').innerHTML = mark(SR[t], R.w);
  const nOk = TGT.filter((_, j) => solved3(j)).length;
  $('#st3').textContent = `${nOk} of ${TGT.length} targets solved.`; $('#st3').className = 'status ' + (nOk === TGT.length ? 'ok' : '');
  if (!R.w.length) $('#res3').innerHTML = '<div class="card"><div class="small">Type a query to see the weight of each of its words and the five reviews with the highest score.</div></div>';
  else {
    const order = R.sc.map((v, j) => [v, j]).sort((a, b) => b[0] - a[0]).slice(0, 5);
    if (!order.some(o => o[1] === t)) order.push([R.sc[t], t]);
    const pos = j => R.sc.filter(v => v > R.sc[j] + 1e-12).length + 1;
    $('#res3').innerHTML = `<div class="card"><div class="lab">Your query words</div><div class="scroll"><table><tr><th>word</th><th class="r">df</th><th class="r">idf = log(${I.N} / df)</th><th class="r">tf in target</th><th class="r">tf × idf in target</th></tr>${R.w.map((x, j) => { const tf = I.C[t].get(x) || 0; return `<tr><td class="mono">${esc(x)}</td><td class="r mono">${I.df.get(x) || 0}</td><td class="r mono">${I.df.has(x) ? f2(R.idf[j]) : '–'}</td><td class="r mono">${tf}</td><td class="r mono">${f2(tf * R.idf[j])}</td></tr>`; }).join('')}</table></div>
      ${R.w.some(x => !I.df.has(x)) ? '<div class="small">– : the word is in none of the reviews, so it adds nothing to any score.</div>' : ''}</div>
      <div class="card"><div class="lab">Top five reviews for your query</div><div class="scroll"><table><tr><th class="r">rank</th><th class="r">score</th><th>= sum of tf × idf</th><th>review</th></tr>${order.map(([v, j]) => `<tr style="${j === t ? 'background:#e3f1e9' : ''}"><td class="r mono">${pos(j)}</td><td class="r mono"><b>${f2(v)}</b></td><td class="mono" style="font-size:13px;white-space:nowrap">${breakdown(R, j)}</td><td style="font-size:14px">${j === t ? '<b>target</b> · ' : ''}${mark(snip(SR[j], R.w), R.w)}</td></tr>`).join('')}</table></div></div>`;
  }
  if (ok) {
    S.max3 = Math.max(S.max3, Math.min(k + 1, TGT.length - 1));
    const C = I.C[t], top = [...C].map(([w, tf]) => ({ w, tf, x: tf * idfOf(w) })).sort((a, b) => b.x - a.x).slice(0, 5), mx = top[0].x, mine = new Set(R.w);
    $('#won3').innerHTML = `<div class="box sep"><div class="status ok">Solved. ${TGT[k].lesson()}</div>
      <div class="card"><div class="lab">Compare with TF-IDF · the five heaviest words of this review</div>
      <table>${top.map(x => `<tr><td class="mono" style="width:120px">${mine.has(x.w) ? '<b>' + esc(x.w) + '</b> ✓' : esc(x.w)}</td><td class="r mono" style="width:150px;white-space:nowrap">${x.tf} × ${f2(idfOf(x.w))} = ${f2(x.x)}</td><td><div class="bar" style="height:14px;border-radius:3px;background:var(--navy);width:${x.x / mx * 100}%"></div></td></tr>`).join('')}</table>
      <div class="small">✓ = a word of your query. What you searched for by trial and error is what TF-IDF computes: these weights are the features the classifier of the case study receives.</div></div>
      ${k < TGT.length - 1 ? `<div><button class="btn primary" data-t3="${k + 1}">Next target →</button></div>` : ''}</div>`;
    document.querySelectorAll('.toggle [data-t3]').forEach((b, j) => { if (j <= S.max3) { b.disabled = false; b.style.opacity = 1; b.style.cursor = 'pointer'; } b.textContent = (solved3(j) ? '✓ ' : '') + 'Target ' + (j + 1); });
  } else $('#won3').innerHTML = '';
  const all = nOk === TGT.length;
  if (all) { S.ok[1] = true; drawStepper(); }
  $('#after3').innerHTML = all ? s3after() : '';
}
function s3after() {
  return afterPass('Target 1 · black listed\nTarget 2 · dies charged\nTarget 3 · expensive product all\nTarget 4 · except battery\nTarget 5 · could be happy', 'several queries can be correct, these are one set', {
    id: 'x3', q: 'Explain it · which sentence sums up what the five targets showed?', opts: [
      'A word weighs a lot in a review when it is frequent there and rare in the collection; a common word adds almost nothing, and a rare word shared by many reviews cannot tell them apart.',
      'The rarest word of a review is always enough to find it.',
      'The longest review always wins, because it contains the most words.'], right: 0,
    why: 'phone failed because it is everywhere, expensive tied because 14 reviews share it, battery lost to reviews that repeat it, and could be happy won with no rare word at all.' });
}
function s3rerender() { const y = window.scrollY; $('#stage').innerHTML = s3(); s3wire(); window.scrollTo(0, y); }


/* ---------- steps ---------- */
const STEPS = [
  { label: 'Bag of words', title: '1 · Bag of words by hand', html: s2, wire: s2wire },
  { label: 'Search with TF-IDF', title: '2 · What makes a review stand out', html: s3, wire: s3wire },
];
function drawStepper() {
  $('#stepper').innerHTML = STEPS.map((s, i) => `<button data-go="${i}" style="background:${i === S.step ? '#1B2F6B' : S.ok[i] ? '#26314F' : '#5A6385'}"><span class="n">${i + 1} ${S.ok[i] ? '✓' : ''}</span><span class="l">${s.label}</span></button>`).join('');
}
function render() {
  const st = STEPS[S.step];
  $('#title').textContent = st.title;
  $('#stage').innerHTML = st.html();
  st.wire();
  drawStepper();
  $('#pos').textContent = `${S.step + 1} / ${STEPS.length}`;
  $('#prev').style.opacity = S.step > 0 ? 1 : .4;
  $('#next').style.opacity = S.step < STEPS.length - 1 ? 1 : .4;
}
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  S.step = i;
  try { history.replaceState(null, '', '#step' + (i + 1)); } catch (e) {}
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.mcq) { S[d.mcq] = { pick: +d.i }; if (S.step === 1) s3check(); else render(); }
  else if (d.pk !== undefined) { S.pk[d.pk] = !S.pk[d.pk]; S.cp = false; render(); }
  else if (d.cp) { S.cp = true; render(); }
  else if (d.yn) { S.yn = d.yn; render(); }
  else if (d.t3 !== undefined) { if (+d.t3 <= S.max3) { S.t3 = +d.t3; s3rerender(); const q = $('#q3'); if (q) q.focus({ preventScroll: true }); } }
  else if (d.seg) { const [g, v] = d.seg.split(':'); S[g] = v; render(); }
  else if (d.hint) { S['hint' + d.hint] = !S['hint' + d.hint]; if (S.step === 1) s3rerender(); else render(); }
  else if (d.go !== undefined) go(+d.go);
});
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step + 1);
const mh = location.hash.match(/step(\d)/);
S.step = mh ? Math.min(Math.max(+mh[1] - 1, 0), STEPS.length - 1) : 0;
render();
</script>
