<style>
/* VOICE: course material, same family as the Week 6 interactive page
   IDEA: a stepped walkthrough of the methods the class used, one step per group of methods
   PICTURE: method cards, each with what it does, a code line and how each submission applied it

   LAYOUT: kicker + title, stepper, stage of cards, pill pager */
:root{--navy:#1B2F6B;--navy2:#26314F;--muted:#5A6385;--tint:#EEF1FE;--ice:#B9C8FC;--green:#1e7a4c;--red:#b3261e;--line:#C9D0EE;--bg:#ffffff;--card:#fff}
:root[data-theme=dark]{--navy:#dfe5ff;--navy2:#c6cff5;--muted:#9aa5c8;--tint:#18213f;--ice:#34407a;--green:#5cc28c;--red:#f08a80;--line:#2c3763;--bg:#0f1530;--card:#141b3a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--navy:#dfe5ff;--navy2:#c6cff5;--muted:#9aa5c8;--tint:#18213f;--ice:#34407a;--green:#5cc28c;--red:#f08a80;--line:#2c3763;--bg:#0f1530;--card:#141b3a}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Arial,Helvetica,sans-serif;overflow-x:clip}
.topnav{font-size:14px;background:#1B2F6B;color:#fff;padding:8px 16px;display:flex;gap:18px;flex-wrap:wrap}.topnav b{font-weight:bold}.topnav span:last-child{color:#B9C8FC;margin-left:auto}
.wrap{min-height:100vh;padding:40px 32px 64px}
.col{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.kicker{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{margin:8px 0 0;font-family:Georgia,serif;font-weight:700;font-size:40px;line-height:1.1;text-wrap:balance}
h3{margin:0;font-family:Georgia,serif;font-size:21px;line-height:1.2}
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stepper button{text-align:left;font:inherit;border:0;border-radius:8px;padding:10px 14px;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.stepper .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px}.stepper .l{font-size:14px;line-height:1.25}
.task{margin:0;font-size:20px;line-height:1.4;max-width:800px}
.lab{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.stage{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--card)}
.card p{margin:0;font-size:16px;line-height:1.5}
pre.sol{margin:0;font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--tint);border:2px solid var(--green);border-radius:8px;padding:10px 14px;overflow:auto;white-space:pre-wrap;color:var(--navy)}
.who{border-top:1px solid var(--line);padding-top:10px}
.who summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;font-weight:bold;color:var(--green);min-height:36px}
.who summary::-webkit-details-marker{display:none}
.who summary::after{content:'+';font-family:'JetBrains Mono',monospace;font-size:20px;line-height:1}
.who[open] summary::after{content:'−'}
.who .rows{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--ice);border-radius:8px;padding:8px 12px;background:var(--tint);font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:'JetBrains Mono',monospace;font-size:14px;padding:2px 7px;border-radius:5px;background:var(--card);border:1px solid var(--line);white-space:nowrap;flex:none}
.chip.c{background:var(--navy);color:var(--bg);border-color:var(--navy);font-weight:700}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.mono{font-family:'JetBrains Mono',monospace}
.scroll{overflow-x:auto}
table{border-collapse:collapse;font-size:15px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:500}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bad{color:var(--red)}
.grp{display:flex;flex-direction:column;gap:4px}.grp .small{font-family:'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
ol.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
ol.flow li{counter-increment:s;border:1px solid var(--ice);border-radius:10px;background:var(--tint);padding:12px 14px;font-size:15px;line-height:1.45}
ol.flow li::before{content:counter(s);display:block;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--green);margin-bottom:4px}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;align-self:center;background:#1B2F6B;color:#fff;border-radius:999px;padding:6px 10px;margin-top:8px}
.pager button{font:inherit;font-size:22px;line-height:1;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:#fff;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{font-family:'JetBrains Mono',monospace;font-size:15px;min-width:64px;text-align:center}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media(max-width:600px){.wrap{padding:24px 16px 48px}h1{font-size:30px}.task{font-size:18px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--muted);font-size:13px}.stack td:empty{display:none}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={ok:'Τρέχει',no_outputs:'Χωρίς outputs',out_of_order:'Εκτέλεση εκτός σειράς',broken:'Σφάλμα εκτέλεσης'};
const CAT=[
 {id:'data',label:'Δεδομένα',title:'Δεδομένα και leakage',intro:'Πώς καθαρίστηκαν τα δεδομένα πριν το split και πώς ελέγχθηκε ότι το test set δεν διαρρέει στην εκπαίδευση.',items:[
  ['dedup','Αφαίρεση διπλοτύπων πριν το split','Οι ίδιες κριτικές εμφανίζονται πολλές φορές στο dataset, συχνά σε διαφορετικές καταχωρίσεις του ίδιου κινητού. Όταν παραμένουν, το ίδιο κείμενο βρίσκεται και στο train και στο test και το AUC υπερεκτιμάται.','df = df.drop_duplicates(subset="Reviews")'],
  ['dedup_partial','Μερική αφαίρεση διπλοτύπων','Τα διπλότυπα αφαιρούνται με βάση συνδυασμό στηλών ή σε αντίγραφο των δεδομένων που δεν φτάνει στο split, οπότε κοινά κείμενα μπορεί να παραμένουν.','df_clean = df.drop_duplicates(subset=["Product Name", "Reviews"])'],
  ['dropna','Στοχευμένο dropna','Αφαιρούνται μόνο οι γραμμές χωρίς κείμενο ή βαθμολογία, ώστε να μη χάνονται κριτικές επειδή λείπει η τιμή ή η μάρκα.','df = df.dropna(subset=["Reviews", "Rating"])'],
  ['starsLeak','Κριτικές που αναφέρουν αστέρια','Κείμενα όπως «I give it 5 stars» περιέχουν την ίδια την ετικέτα. Αφαιρούνται με regular expression.','mask = df["Reviews"].str.contains(r"\\b[1-5]\\s*stars?\\b", case=False)\ndf = df[~mask]'],
  ['overlap','Έλεγχος overlap train/test','Μετά το split μετρώνται τα κείμενα που υπάρχουν και στα δύο σύνολα. Η τιμή 0 επιβεβαιώνει ότι δεν υπάρχει διαρροή.','len(set(X_train) & set(X_test))'],
  ['stratsample','Stratified δείγμα','Το δείγμα του dataset παίρνεται με stratify, ώστε να κρατά την αναλογία θετικών και αρνητικών κριτικών του συνόλου.','sample, _ = train_test_split(df, train_size=0.10,\n                             stratify=df["positive"], random_state=42)'],
  ['bigsample','Μεγαλύτερο δείγμα','Το δείγμα αυξάνεται από 10% σε 20%, 25% ή σε όλο το dataset, για μεγαλύτερο λεξιλόγιο και πιο σταθερά βάρη.','df = df.sample(frac=0.2, random_state=10)']]},
 {id:'split',label:'Split',title:'Split και σχεδιασμός πειραμάτων',intro:'Πώς χωρίστηκαν τα δεδομένα και πώς οργανώθηκαν οι συγκρίσεις.',items:[
  ['stratify','Stratified split','Η αναλογία θετικών και αρνητικών κριτικών (περίπου 3:1) διατηρείται ίδια σε train και test.','train_test_split(X, y, stratify=y, random_state=0)'],
  ['validation','Validation set','Ένα δεύτερο split δημιουργεί validation set. Εκεί γίνονται όλες οι συγκρίσεις και το test χρησιμοποιείται μία φορά στο τέλος.','X_train, X_val, y_train, y_val = train_test_split(\n    X_rest, y_rest, test_size=0.2, stratify=y_rest)'],
  ['earlystop','Validation για early stopping','Ένα κομμάτι του train σταματά την εκπαίδευση του XGBoost όταν το AUC πάψει να βελτιώνεται.','xgb = XGBClassifier(eval_metric="auc", early_stopping_rounds=20)\nxgb.fit(X_tr, y_tr, eval_set=[(X_val, y_val)])'],
  ['groupsplit','Split ανά ομάδα κειμένου','Οι κριτικές με το ίδιο κανονικοποιημένο κείμενο μένουν μαζί, είτε στο train είτε στο test, ώστε το ίδιο κείμενο να μη βρίσκεται και στα δύο σύνολα.','GroupShuffleSplit(n_splits=1, test_size=0.25, random_state=0)\n  .split(X, y, groups=df["Review Group"])'],
  ['seed','Διαφορετικό random_state','Αλλάζει το random_state του δείγματος και του split, οπότε τα αποτελέσματα προκύπτουν από διαφορετικό δείγμα και διαφορετικό test set.','df.sample(frac=0.1, random_state=20)'],
  ['ablation','Μία αλλαγή κάθε φορά','Κάθε παράγοντας (vectorizer, min_df, max_df, C) αλλάζει χωριστά, ώστε η διαφορά στο AUC να αποδίδεται σε συγκεκριμένη αλλαγή.','results = {\n  "Count, min_df=5": evaluate(CountVectorizer(min_df=5)),\n  "TF-IDF, default": evaluate(TfidfVectorizer()),\n}']]},
 {id:'rep',label:'Αναπαράσταση',title:'Αναπαράσταση κειμένου',intro:'Πώς μετατράπηκαν οι κριτικές σε διανύσματα.',items:[
  ['tfidf_bi','TF‑IDF με bigrams','Συνδυάζονται δύο βήματα του notebook: η στάθμιση TF‑IDF και τα ζεύγη γειτονικών λέξεων (not good, no problems).','TfidfVectorizer(min_df=5, ngram_range=(1, 2))'],
  ['trigrams','Trigrams','Τριάδες λέξεων πιάνουν φράσεις όπως «not an issue» και «worst phone ever», που ένα bigram δεν ενώνει.','CountVectorizer(min_df=5, ngram_range=(1, 3))'],
  ['char','Character n‑grams','Ακολουθίες 3–5 χαρακτήρων μέσα στις λέξεις αντέχουν σε ορθογραφικά λάθη (excelent, exellent).','TfidfVectorizer(analyzer="char_wb", ngram_range=(3, 5))'],
  ['binary','Δυαδικός CountVectorizer','Κάθε όρος καταγράφεται ως παρών ή απών (0/1) αντί για το πλήθος των εμφανίσεών του.','CountVectorizer(min_df=5, ngram_range=(1, 2), binary=True)'],
  ['sublinear','sublinear_tf','Η συχνότητα αντικαθίσταται από 1 + log(tf), ώστε μια λέξη που επαναλαμβάνεται να μην κυριαρχεί σε μια κριτική.','TfidfVectorizer(sublinear_tf=True)'],
  ['maxdf','max_df','Αγνοούνται όροι που εμφανίζονται σε πολύ μεγάλο ποσοστό των κριτικών.','TfidfVectorizer(max_df=0.95)'],
  ['maxfeat','max_features','Το λεξιλόγιο περιορίζεται στους πιο συχνούς όρους, για ταχύτητα ή μικρότερο μοντέλο.','TfidfVectorizer(max_features=15000)'],
  ['tokenpat','Προσαρμοσμένο token_pattern','Αλλάζει το τι θεωρείται token: μόνο γράμματα ή και μεμονωμένοι χαρακτήρες.','TfidfVectorizer(token_pattern=r"\\b[a-zA-Z]{2,}\\b")'],
  ['svd','Μείωση διαστάσεων με SVD','Ο αραιός πίνακας TF‑IDF συμπιέζεται σε λίγες πυκνές διαστάσεις (LSA) πριν φτάσει στο μοντέλο.','Pipeline([("tfidf", tfidf), ("svd", TruncatedSVD(n_components=150)),\n          ("clf", XGBClassifier())])'],
  ['meta','Μετα‑χαρακτηριστικά','Πέρα από το κείμενο προστίθενται αριθμητικά χαρακτηριστικά, όπως πλήθος λέξεων και θαυμαστικών.','ColumnTransformer([\n  ("text", TfidfVectorizer(), "Clean_Reviews"),\n  ("meta", StandardScaler(), ["word_count", "exclamation_count"])])']]},
 {id:'prep',label:'Προεπεξεργασία',title:'Προεπεξεργασία κειμένου',intro:'Τι αλλάζει στο κείμενο πριν φτάσει στον vectorizer.',items:[
  ['stop_default','Έτοιμη λίστα stop words','Αφαιρούνται οι συχνές αγγλικές λέξεις της scikit‑learn. Η λίστα περιέχει και τα not, no, never, οπότε μαζί τους χάνεται η άρνηση.','CountVectorizer(stop_words="english")'],
  ['stop_keepneg','Stop words που κρατούν τις αρνήσεις','Αφαιρούνται οι συχνές λέξεις εκτός από τις λέξεις άρνησης, που φέρουν το συναίσθημα.','negations = {"not", "no", "nor", "never"}\nstop = list(ENGLISH_STOP_WORDS - negations)'],
  ['stop_tested','Stop words ως πείραμα','Η έτοιμη λίστα δοκιμάζεται ως ξεχωριστή ρύθμιση, ώστε να μετρηθεί η επίδρασή της στο AUC.','evaluate(TfidfVectorizer(stop_words="english"))'],
  ['negexpand','Ανάπτυξη του n\'t σε not','Οι συντμήσεις όπως don\'t και doesn\'t γίνονται do not και does not πριν το tokenization, ώστε η άρνηση να γίνει ξεχωριστό token.','text = text.lower().replace("n\'t", " not")'],
  ['stem','Stemming','Οι λέξεις κόβονται στη ρίζα τους (disappointed → disappoint).','stemmer = PorterStemmer()\ntokens = [stemmer.stem(w) for w in re.findall(r"\\b\\w\\w+\\b", text.lower())]'],
  ['lemma','Lemmatization','Οι λέξεις επιστρέφουν στο λήμμα τους με βάση λεξικό (phones → phone).','WordNetLemmatizer().lemmatize(w)'],
  ['clean','Καθαρισμός κειμένου','Αφαιρούνται HTML tags, URLs, σημεία στίξης ή περιττά κενά.','text = re.sub(r"<[^>]+>", " ", text)']]},
 {id:'mod',label:'Μοντέλα',title:'Μοντέλα ταξινόμησης',intro:'Ποιοι ταξινομητές εκπαιδεύτηκαν πάνω στα διανύσματα.',items:[
  ['lr_C','Logistic Regression με ρύθμιση του C','Οι τιμές TF‑IDF είναι μικρές, οπότε μεγαλύτερο C (λιγότερο regularization) αφήνει τα βάρη να μεγαλώσουν.','LogisticRegression(C=5, max_iter=2000)'],
  ['nb','Naive Bayes','Μετρά πόσο συχνά εμφανίζεται κάθε λέξη σε κάθε κλάση και εκπαιδεύεται σε ένα πέρασμα. Στη θέση των coefficients χρησιμοποιείται η διαφορά των log πιθανοτήτων.','nb = MultinomialNB(alpha=0.3)\nnb.feature_log_prob_[1] - nb.feature_log_prob_[0]'],
  ['svc','Linear SVM','Γραμμικός ταξινομητής μέγιστου περιθωρίου. Με calibration δίνει πιθανότητες για τον υπολογισμό του AUC.','CalibratedClassifierCV(LinearSVC(C=0.5))'],
  ['sgd','SGDClassifier','Logistic Regression που εκπαιδεύεται με stochastic gradient descent.','SGDClassifier(loss="log_loss", alpha=1e-5)'],
  ['xgb','XGBoost','Ensemble δέντρων απόφασης. Δεν έχει coefficients με πρόσημο: τα feature_importances_ δείχνουν πόσο χρησιμοποιείται μια λέξη, όχι προς ποια κλάση οδηγεί.','XGBClassifier(n_estimators=300, max_depth=4)'],
  ['ensemble','Ensemble με soft voting','Οι πιθανότητες περισσότερων ταξινομητών συνδυάζονται με βάρη.','VotingClassifier([("lr", lr), ("svc", svc), ("cnb", cnb)],\n                 voting="soft", weights=[2, 2, 1])'],
  ['classWeight','Βάρη κλάσεων','Η αρνητική κλάση, που είναι η μειοψηφία, παίρνει μεγαλύτερο βάρος στην εκπαίδευση.','LogisticRegression(class_weight="balanced")']]},
 {id:'eval',label:'Αξιολόγηση',title:'Αξιολόγηση, επιλογή και threshold',intro:'Τι μετρήθηκε πέρα από το AUC και πού επιλέχθηκαν οι υπερπαράμετροι και το κατώφλι απόφασης.',items:[
  ['report','Classification report','Precision, recall και F1 ανά κλάση, ώστε να φαίνεται η απόδοση στις αρνητικές κριτικές.','print(classification_report(y_test, y_pred))'],
  ['cm','Confusion matrix','Πίνακας με τις σωστές και τις λάθος προβλέψεις κάθε κλάσης.','confusion_matrix(y_test, y_pred)'],
  ['roc','ROC curve','Καμπύλη TPR–FPR για όλα τα thresholds, με σύγκριση μοντέλων στο ίδιο γράφημα.','RocCurveDisplay.from_predictions(y_test, scores)'],
  ['trainTest','Train vs test AUC','Η απόσταση ανάμεσα στο AUC του train και του test δείχνει πόσο υπερπροσαρμόζεται το μοντέλο.','roc_auc_score(y_train, model.predict_proba(X_tr)[:, 1])'],
  ['errors','Ανάλυση λαθών','Εξετάζονται οι κριτικές με τις πιο λανθασμένες προβλέψεις (false positives και false negatives).','errors[errors.Actual == 0].sort_values("Prob_Pos").tail(5)'],
  ['tune_val','Επιλογή ρυθμίσεων στο validation','Οι ρυθμίσεις και τα μοντέλα συγκρίνονται στο validation set· το test μένει για την τελική μέτρηση.','roc_auc_score(y_val, model.predict_proba(X_val)[:, 1])'],
  ['tune_test','Επιλογή ρυθμίσεων στο test','Οι ρυθμίσεις και τα μοντέλα συγκρίνονται απευθείας στο test set.','roc_auc_score(y_test, model.predict_proba(X_test)[:, 1])'],
  ['thr_val','Threshold από το validation','Το κατώφλι απόφασης επιλέγεται στο validation με βάση μια μετρική και εφαρμόζεται μετά στο test.','pred = (test_scores >= best_t).astype(int)'],
  ['thr_test','Threshold από το test','Το κατώφλι απόφασης επιλέγεται σαρώνοντας τιμές στο ίδιο το test set.','for t in np.arange(0.10, 0.91, 0.02): ...']]}

function perSub(){
 return `<div class="grid2">${sorted().map(s=>{const by={};(s.methods||[]).forEach(k=>{const o=GROUP_OF[k];if(o)(by[o.g]=by[o.g]||[]).push(o.t)});
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><span class="chip c">${esc(s.code)}</span><span class="small mono">Δείγμα ${esc(s.sample)}% · AUC ${auc(s.auc)}${s.status&&s.status!=='ok'?` · <span class="bad">${STATUS[s.status]||''}</span>`:''}</span></div><p>${esc(s.summary)}</p><details class="who"><summary>Μέθοδοι <span class="mono">(${(s.methods||[]).length})</span></summary><div class="rows">${CAT.filter(g=>by[g.label]).map(g=>`<div class="grp"><span class="small">${esc(g.label)}</span><div class="chips">${by[g.label].map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>`).join('')}</div></details></div>`}).join('')}</div>`;
}
function synth(){
 const S=[['Δεδομένα','Αφαίρεση διπλοτύπων πριν το split και έλεγχος ότι train και test δεν έχουν κοινά κείμενα.'],['Split','Stratified split σε train, validation και test.'],['Αναπαράσταση','TF‑IDF με bigrams και sublinear_tf.'],['Προεπεξεργασία','Stop words μόνο αν κρατούν τις λέξεις άρνησης.'],['Μοντέλο','Logistic Regression, με C που επιλέγεται στο validation.'],['Σχεδιασμός','Μία αλλαγή κάθε φορά, με πίνακα αποτελεσμάτων στο validation.'],['Απόφαση','Threshold από το validation, όταν χρειάζεται πρόβλεψη 0/1.'],['Αξιολόγηση','Μία μέτρηση στο test, classification report και ανάλυση λαθών.']];
 return `<p class="task">Οι μέθοδοι των εργασιών συνδυάζονται σε μία ροή, από τα δεδομένα μέχρι την τελική μέτρηση.</p><ol class="flow">${S.map(([a,b])=>`<li><b>${a}</b><br>${b}</li>`).join('')}</ol>`;
}

function draw(){
 const st=STEPS[step];$('#title').textContent=st.title;$('#stage').innerHTML=st.html();
 $('#stepper').innerHTML=STEPS.map((s,i)=>`<button data-go="${i}" style="background:${i===step?'#1B2F6B':seen.has(i)?'#26314F':'#5A6385'}" aria-current="${i===step}"><span class="n">${i+1}</span><span class="l">${s.label}</span></button>`).join('');
 $('#pos').textContent=`${step+1} / ${STEPS.length}`;$('#prev').disabled=step===0;$('#next').disabled=step===STEPS.length-1;
}
function go(i){step=Math.max(0,Math.min(STEPS.length-1,i));seen.add(step);draw();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
$('#prev').onclick=()=>go(step-1);$('#next').onclick=()=>go(step+1);
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1)});
draw();
subs=DATA;$('#stamp').textContent=subs.length+' εργασίες';draw();
}
</script>
