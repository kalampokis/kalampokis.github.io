const PROJECTOR = 'https://projector.tensorflow.org/?config=https://kalampokis.github.io/Week7/projector/projector_config.json';
const ATLAS = 'https://apple.github.io/embedding-atlas/app/';

/* ---------- helpers (as in Week 6) ---------- */
const $ = (s, r = document) => r.querySelector(s);
const S = { step: 0, ok: {} };
function mcq(id, q, opts, right, why) {
  const st = S[id] || {};
  let h = `<div class="box"><div style="font-size:16px">${q}</div>`;
  const rot = [...id].reduce((a, c) => a + c.charCodeAt(0), 0) % (opts.length - 1) + 1;
  opts.map((o, i) => i).slice(rot).concat(opts.map((o, i) => i).slice(0, rot)).forEach(i => { const o = opts[i]; let cls = ''; if (st.pick === i) cls = i === right ? 'right' : 'wrong'; h += `<button class="opt ${cls}" data-mcq="${id}" data-i="${i}">${o}</button>`; });
  if (st.pick !== undefined) h += `<div class="status ${st.pick === right ? 'ok' : 'bad'}">${st.pick === right ? 'Correct. ' + why : 'Not quite. Read the other options again.'}</div>`;
  return h + '</div>';
}
const mcqOk = (id, right) => S[id] && S[id].pick === right;
const nextBtn = () => S.step + 1 < STEPS.length ? `<div><button class="btn primary" data-go="${S.step + 1}">Next step →</button></div>` : '<div class="done">Exercise complete. Be ready to explain each choice aloud.</div>';
function chain(qs) { let h = '', open = true; qs.forEach((q, i) => { if (!open) return; h += `<div class="box sep"><div class="lab">${q.lab || 'Task ' + (i + 1) + ' of ' + qs.length}</div>${q.pre || ''}${mcq(q.id, q.q, q.opts, q.right, q.why)}</div>`; open = mcqOk(q.id, q.right); }); return { h, done: open }; }
const linkBtn = (href, text) => `<div><a class="btn primary" style="display:inline-block;text-decoration:none" href="${href}" target="_blank" rel="noopener">${text}</a></div>`;
const w = t => `<span class="mono">${t}</span>`;
const doList = items => `<ol style="margin:0;padding-left:22px;font-size:16px;line-height:1.6">${items.map(x => `<li>${x}</li>`).join('')}</ol>`;

/* ---------- step 1: the word space in the Embedding Projector ---------- */
function s1() {
  let h = `<div class="box"><p class="task">Slides 25 and 37 · Open our word2vec model in the Embedding Projector and check in the tool what the slides claim. Each task tells you what to do; then answer its question.</p>
  <div class="grid2">
    <div class="card"><div class="lab">What you will see</div>
      <div class="rv"><b>The data:</b> all 5,667 words of our word2vec model, trained on the 23,052 training reviews. Each word is a point with 100 numbers.</div>
      <div class="rv"><b>The picture:</b> the tool squeezes the 100 numbers into 2 or 3 with PCA, the method of slide 37, or with UMAP.</div>
      <div class="rv"><b>The neighbours:</b> when you click a word, the panel on the right lists its nearest words, measured in all 100 dimensions, not on the picture.</div></div>
    <div class="card"><div class="lab">Before you start</div>
      <div class="rv"><b>Select one word.</b> The <b>Search</b> box on the right finds every word that contains the letters you type: ${w('dies')} also finds ${w('goodies')}. Click the exact word in the list of matches. The neighbours appear only when a single word is selected.</div>
      <div class="rv"><b>Use the cosine.</b> Above the list of neighbours, choose <b>COSINE</b>. The tool shows the <b>cosine distance</b>, which is 1 − cosine similarity: a distance of 0.14 means a cosine similarity of 0.86. Small distance means close in meaning.</div>
      <div class="small">The page needs a few seconds to load the words. It works best on a laptop, in Chrome or Firefox.</div></div>
  </div>
  ${linkBtn(PROJECTOR, 'Open our model in the Embedding Projector ↗')}
  <div class="small">If the link does not load the model: download <a href="projector/vectors.tsv" download>vectors.tsv</a> and <a href="projector/metadata.tsv" download>metadata.tsv</a>, open <a href="https://projector.tensorflow.org/" target="_blank" rel="noopener">projector.tensorflow.org</a>, click <b>Load</b> on the left and choose the two files.</div>`;
  const c = chain([
    { id: 'p1', pre: `<div class="rv">Type ${w('dies')} in the <b>Search</b> box on the right. The tool finds two words, dies and goodies: click <b>dies</b> in the list of matches. On the right appears the list <i>Nearest points in the original space</i>; choose <b>COSINE</b> and read it.</div>`,
      q: 'Which three words are closest to dies?',
      opts: ['die, draining and drain', 'drains, drained and discharges', 'battery, phone and fast', 'died, death and survivor'], right: 0,
      why: 'Their distances are 0.14, 0.15 and 0.15, so their cosine similarities are 0.86, 0.85 and 0.85, as on slide 25. drains is ninth (0.19 → 0.81). The neighbours are the words of the same battery complaints, not only synonyms. died, death and survivor are the neighbours of dies in GloVe, trained on Wikipedia and news (notebook Step 2b).' },
    { id: 'p2', pre: `<div class="rv">Write your prediction first: is ${w('good')}, the opposite of ${w('bad')}, among its five nearest words? Then search for ${w('bad')} and click <b>bad</b> in the list of matches.</div>`,
      q: 'Where is good among the neighbours of bad?',
      opts: ['Among the five nearest, next to iffy, awful and terrible', 'Not among the first ten: opposites are far apart', 'First, far ahead of every other word', 'Last of all 5,667 words'], right: 0,
      why: 'good is fourth, at distance 0.33 (cosine 0.67), almost tied with terrible and dislike. good and bad fill the same places in a sentence (“The phone is ___.”), so they get similar vectors. Opposites share their contexts: close vectors mean that two words can replace each other, not that they agree.' },
    { id: 'p3', pre: `<div class="rv">Search for ${w('excellent')}, click <b>excellent</b> in the list of matches and look at its nearest word.</div>`,
      q: 'Which word is the nearest to excellent, and why did the model put it there?',
      opts: ['excelent, a misspelling: it is used in the same sentences as excellent', 'excelent, a misspelling: word2vec compares the letters of the two words', 'outstanding, a synonym from a dictionary', 'good, because good is the most frequent positive word'], right: 0,
      why: 'Distance 0.16, cosine 0.84. word2vec never sees the letters of a word, only the words around it. The misspelling appears in the same contexts, so it gets almost the same vector. In Week 6, Naive Bayes had to learn each spelling on its own.' },
    { id: 'p4', pre: `<div class="rv">Click <b>Clear selection</b> and choose <b>PCA</b> on the left. Look at the cloud of all 5,667 words and read the line <i>Total variance described</i> under the components. With the box of Component #3 ticked, the picture is in 3D.</div>`,
      q: 'How much of the spread of the 100 numbers do the components keep for all the words?',
      opts: ['Less than a third, so the groups of words are mixed in one cloud', 'About half, as on slide 37', 'Almost all of it, so the picture shows the true distances'], right: 0,
      why: 'Three components keep about 30% of the spread (the tool shows 29.7%), two about 22%. Slide 37 fitted PCA on 19 chosen words and kept 54%: the fewer and more related the words, the more of their differences fit in a few directions. The neighbours in the right panel do not change when the picture changes.' },
    { id: 'p5', pre: `<div class="rv">Search for ${w('refund')}, click <b>refund</b> in the list of matches, set the number of neighbours to about 50 and click <b>Isolate</b>. Then choose the <b>UMAP</b> tab, wait until the points stop moving, and run it a second time.</div>
      <div class="small">UMAP is another method that draws many dimensions in two or three. Unlike PCA, it tries to keep each word next to its nearest neighbours and does not try to keep the large distances. It starts from random positions.</div>`,
      q: 'What can you read from a UMAP picture?',
      opts: ['Who is next to whom; the positions and the distances between groups change from run to run', 'The exact cosine between any two words', 'The same picture in every run, as with PCA', 'Which words are positive and which negative'], right: 0,
      why: 'Small groups such as refund, refunded, exchange, return and policy stand out more clearly than with PCA, but only the neighbourhoods can be trusted. For distances, use the cosine in the original space.' },
  ]);
  h += c.h;
  S.ok[0] = c.done;
  if (c.done) h += `<div class="box sep">${nextBtn()}</div>`;
  return h + '</div>';
}

/* ---------- step 2: a space of reviews in Embedding Atlas ---------- */
function s2() {
  let h = `<div class="box"><p class="task">Slides 38–40 · In Step 1 every point was a word. Now every point is a whole review. Embedding Atlas turns each review into one vector with a small text embedding model, in your browser, and draws the vectors with UMAP.</p>
  <div class="grid2">
    <div class="card"><div class="lab">The data</div>
      <div class="rv">The 1,925 short test reviews of notebook Step 5 (3 to 12 words), with four columns: ${w('review')}, ${w('stars')}, ${w('sentiment')} and ${w('brand')}.</div>
      <div><button class="btn primary" data-dl="1">Download amazon_short_reviews.csv</button></div>
      <div class="small">About 110 KB. The reviews are public Kaggle data.</div></div>
    <div class="card"><div class="lab">Load it into Embedding Atlas</div>
      ${doList(['Open Embedding Atlas with the button below, in Chrome or Edge on a laptop.', 'Drag the CSV file into the page.',
        `In <b>Search and Tooltip</b>, keep <b>Text</b> = ${w('review')}.`,
        `In <b>Embedding View</b>, click the tab <b>From Text</b> (not <i>Pre-computed</i>) and choose the column ${w('review')}. Then click <b>Confirm</b>.`,
        'Wait one or two minutes: the first time, the model is downloaded. At the top right you should read <b>1,925 points</b>, and a map of points appears next to the table.'])}
      <div class="small">If it reads 413,840 points, you loaded the whole Kaggle file: open Embedding Atlas again and drag <span class="mono">amazon_short_reviews.csv</span>. If there is a table but no map, the tab <b>From Text</b> was not chosen.</div>
      <div class="small">The vectors and the map are computed in your browser: the file does not leave your computer.</div></div>
  </div>
  ${linkBtn(ATLAS, 'Open Embedding Atlas ↗')}`;
  const c = chain([
    { id: 'a1', pre: `<div class="rv">Colour the points by ${w('sentiment')}, then by ${w('stars')}. Hover over a few points to read their reviews.</div>`,
      q: 'What does each point of this map stand for?',
      opts: ['One whole review, turned into one vector by a text embedding model', 'One word, as in the Embedding Projector', 'One brand of phone', 'The average of the word2vec vectors of a review'], right: 0,
      why: 'This is the text embedding of slide 38: one vector per text, from a model that reads every word in its context. In Step 1 the points were the words of our word2vec model.' },
    { id: 'a2', pre: `<div class="rv">Search for ${w('Broke after first use')} and select it, so that the tool shows its nearest neighbours. Read them.</div>`,
      q: 'Some neighbours share no word with “Broke after first use”. How can they still be close?',
      opts: ['The model compares meanings: reviews about a phone that stopped working get close vectors even when they use other words', 'Embedding Atlas looks for reviews with the same letters', 'The neighbours are chosen at random around the point', 'They have the same number of stars'], right: 0,
      why: 'The same happened in notebook Step 5: the text embedding model found “Broke after first use” for the query arrived broken, without a shared word. TF-IDF can find only reviews that share the words of the query.' },
    { id: 'a3', pre: `<div class="rv">Find a region of the map where negative reviews gather. Select it, and look at the chart of ${w('stars')} for the selected reviews.</div>`,
      q: 'What does the selection tell you about the map?',
      opts: ['Reviews that are close usually share their opinion as well as their topic, but not always: some positive reviews sit among the complaints', 'Every review in the region has 1 star', 'Position on the map has nothing to do with the stars', 'The map was drawn from the stars'], right: 0,
      why: 'The model was never told the stars: the map comes from the text alone, and yet opinions gather. They do not separate perfectly, as in Step 4 of the notebook, where even the text embedding models put “Not good, bad.” close to “Good, not bad.”.' },
    { id: 'a4', q: 'Why does a model that reads the whole review tell a complaint from praise better than the average of word2vec vectors (notebook Step 5)?',
      opts: ['It reads each word in its context, so arrived next to broken is not the same as arrived next to on time', 'It was trained on our 1,925 reviews', 'It counts the words, like TF-IDF', 'It knows the stars of every review'], right: 0,
      why: 'The average gives every word one vector and then forgets the order, so it keeps the topic (arrival) and loses the opinion. How a model lets each word take its meaning from the others is the topic of Weeks 8 and 9.' },
  ]);
  h += c.h;
  S.ok[1] = c.done;
  if (c.done) h += `<div class="box sep">${nextBtn()}</div>`;
  return h + '</div>';
}

/* ---------- steps ---------- */
const STEPS = [
  { label: 'Word vectors', title: '1 · Explore our word space', html: s1 },
  { label: 'Text vectors', title: '2 · Explore a space of reviews', html: s2 },
];
function drawStepper() {
  $('#stepper').innerHTML = STEPS.map((s, i) => `<button data-go="${i}" style="background:${i === S.step ? '#1B2F6B' : S.ok[i] ? '#26314F' : '#5A6385'}"><span class="n">${i + 1} ${S.ok[i] ? '✓' : ''}</span><span class="l">${s.label}</span></button>`).join('');
}
function render() {
  const st = STEPS[S.step];
  $('#title').textContent = st.title;
  $('#stage').innerHTML = st.html();
  drawStepper();
  $('#pos').textContent = `${S.step + 1} / ${STEPS.length}`;
  $('#prev').style.opacity = S.step > 0 ? 1 : .4;
  $('#next').style.opacity = S.step < STEPS.length - 1 ? 1 : .4;
}
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  S.step = i;
  try { history.replaceState(null, '', '#step' + (i + 1)); } catch (e) {}
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function keep(f) { const y = window.scrollY; f(); window.scrollTo(0, y); }
function download() {
  const url = URL.createObjectURL(new Blob([CSV], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'amazon_short_reviews.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.mcq) { S[d.mcq] = { pick: +d.i }; keep(render); }
  else if (d.dl) download();
  else if (d.go !== undefined) go(+d.go);
});
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step + 1);
const mh = location.hash.match(/step(\d)/);
S.step = mh ? Math.min(Math.max(+mh[1] - 1, 0), STEPS.length - 1) : 0;
render();
</script>
</body>
