    S.max2 = Math.max(S.max2, Math.min(k + 1, TG.length - 1));
    $('#won2').innerHTML = `<div class="box sep"><div class="status ok">Target met. ${TG[k].lesson(R)}</div>${k < TG.length - 1 ? `<div><button class="btn primary" data-t2="${k + 1}">Next target →</button></div>` : ''}</div>`;
    document.querySelectorAll('.toggle [data-t2]').forEach((b, j) => { if (j <= S.max2) { b.disabled = false; b.style.opacity = 1; b.style.cursor = 'pointer'; } b.textContent = (solved2(j) ? '✓ ' : '') + 'Target ' + (j + 1); });
  } else $('#won2').innerHTML = '';
  const all = TG.every((_, j) => solved2(j));
  if (all && !S.ok[1]) { S.ok[1] = true; drawStepper(); }
  $('#after2').innerHTML = all ? afterPass('Target 1 · not\nTarget 2 · refund\nTarget 3 · not good', 'many reviews meet each target, these are one set', {
    id: 'x2', q: 'Explain it · which sentence explains all three targets?', opts: [
      'λ scores each word alone; w scores what a word adds when the other words of the review are present. Words that usually come together (not next to praise, refund next to return) are where the two disagree, and neither model can do more than add one number per word.',
      'Logistic regression is trained on more reviews than Naïve Bayes.',
      'Naïve Bayes ignores the log prior, logistic regression does not.'], right: 0,
    why: 'Same data, same matrix, same shape of model. Counting assumes the words are independent; learning does not, so it can share evidence among words that travel together. Neither sees order: Target 3 fools both.' }) : '';
}
function s2rerender() { const y = window.scrollY; $('#stage').innerHTML = s2(); s2wire(); window.scrollTo(0, y); }

/* ---------- steps ---------- */
const STEPS = [
  { label: 'Naïve Bayes by hand', title: '1 · Count the model', html: s1, wire: s1wire },
  { label: 'Counted vs learned', title: '2 · Make the models disagree', html: s2, wire: s2wire },
];
function drawStepper() {
  $('#stepper').innerHTML = STEPS.map((s, i) => `<button data-go="${i}" style="background:${i === S.step ? '#1B2F6B' : S.ok[i] ? '#26314F' : '#5A6385'}"><span class="n">${i + 1} ${S.ok[i] ? '✓' : ''}</span><span class="l">${s.label}</span></button>`).join('');
}
function render() {
  const st = STEPS[S.step];
  $('#title').textContent = st.title;
  $('#stage').innerHTML = st.html();
  st.wire();
  drawStepper();
  $('#pos').textContent = `${S.step + 1} / ${STEPS.length}`;
  $('#prev').style.opacity = S.step > 0 ? 1 : .4;
  $('#next').style.opacity = S.step < STEPS.length - 1 ? 1 : .4;
}
function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  S.step = i;
  try { history.replaceState(null, '', '#step' + (i + 1)); } catch (e) {}
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function keep(f) { const y = window.scrollY; f(); window.scrollTo(0, y); }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.mcq) { S[d.mcq] = { pick: +d.i }; if (S.step === 1) { const y = window.scrollY; s2check(); window.scrollTo(0, y); } else keep(render); }
  else if (d.lab1) { S.lab1 = d.lab1; keep(render); }
  else if (d.alpha !== undefined) { S.alpha = +d.alpha; keep(render); }
  else if (d.add5 !== undefined) { S.add5 = d.add5 === '1'; keep(render); }
  else if (d.t2 !== undefined) { if (+d.t2 <= S.max2) { S.t2 = +d.t2; s2rerender(); const q = $('#q2'); if (q) q.focus({ preventScroll: true }); } }
  else if (d.cw !== undefined) { S.cw[d.cw] = !S.cw[d.cw]; keep(render); }
  else if (d.cz) { const [i, k] = d.cz.split(':'); S.cz[i] = k; S.czc = false; keep(render); }
  else if (d.czc) { S.czc = true; keep(render); }
  else if (d.hint) { S['hint' + d.hint] = !S['hint' + d.hint]; if (S.step === 1) s2rerender(); else keep(render); }
  else if (d.go !== undefined) go(+d.go);
});
$('#prev').onclick = () => go(S.step - 1);
$('#next').onclick = () => go(S.step + 1);
const mh = location.hash.match(/step(\d)/);
S.step = mh ? Math.min(Math.max(+mh[1] - 1, 0), STEPS.length - 1) : 0;
render();
</script>
</body>
</html>
